<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tao Bin Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Login Page -->
  <div id="login-page" class="d-none">
    <div class="login-container">
      <div class="card shadow">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-box-seam display-1 text-primary"></i>
            <h3 class="mt-2">Tao Bin Malaysia</h3>
            <p class="text-muted">Warehouse Inventory System</p>
          </div>
          <div id="login-error" class="alert alert-danger d-none"></div>
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" id="login-username" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-page" class="d-none">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <i class="bi bi-box-seam"></i>
        <span>Tao Bin</span>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active" href="#" data-page="dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="products">
            <i class="bi bi-box"></i> Products
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="categories">
            <i class="bi bi-tags"></i> Categories
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="transactions">
            <i class="bi bi-arrow-left-right"></i> Stock In/Out
          </a>
        </li>
        <li class="nav-item" id="nav-users">
          <a class="nav-link" href="#" data-page="users">
            <i class="bi bi-people"></i> Users
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Navbar -->
      <nav class="navbar navbar-expand navbar-light bg-white shadow-sm mb-4 px-3">
        <button class="btn btn-link" id="sidebar-toggle">
          <i class="bi bi-list fs-4"></i>
        </button>
        <span class="navbar-text ms-auto me-3" id="user-display"></span>
        <button class="btn btn-outline-danger btn-sm" id="btn-logout">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </nav>

      <!-- Page Content Container -->
      <div class="container-fluid px-4">
        <!-- Dashboard -->
        <div id="page-dashboard" class="page-content"></div>
        <!-- Products -->
        <div id="page-products" class="page-content d-none"></div>
        <!-- Categories -->
        <div id="page-categories" class="page-content d-none"></div>
        <!-- Transactions -->
        <div id="page-transactions" class="page-content d-none"></div>
        <!-- Users -->
        <div id="page-users" class="page-content d-none"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
